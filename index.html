<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi cobranza · Innovare</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f0f2f5;color:#111b21;padding:14px 14px 90px;max-width:680px;margin:0 auto}
h1{font-size:20px;margin-bottom:2px}
.sub{color:#667781;font-size:13px;margin-bottom:10px}
.tip{background:#fff8e1;border:1px solid #ffe9a8;border-radius:8px;padding:10px 12px;font-size:13px;color:#7a5c00;margin-bottom:14px;line-height:1.45}
.card{background:#fff;border-radius:12px;padding:13px;margin-bottom:11px;box-shadow:0 1px 3px rgba(0,0,0,.1);border-left:5px solid #ccc}
.card.red{border-left-color:#e53935}.card.yel{border-left-color:#fb8c00}.card.green{border-left-color:#43a047}
.card.pag{opacity:.55;border-left-color:#0f8a43;background:#f3fbf5}
.card.pag .name{text-decoration:line-through}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.name{font-weight:700;font-size:16px;cursor:pointer;color:#0a66c2;line-height:1.3}
.name:active{opacity:.5}
.meta{font-size:12px;color:#667781;margin-top:3px}
.amount{font-weight:700;font-size:15px;white-space:nowrap}
.tap{font-size:12px;color:#0a6e2e;margin-top:6px;font-weight:600}
.toggle{font-size:12px;color:#0a66c2;cursor:pointer;user-select:none;margin-top:8px;display:inline-block}
.msg{background:#f7f9fa;border:1px solid #eceff1;border-radius:8px;padding:10px;font-size:13px;white-space:pre-wrap;margin:8px 0;line-height:1.45}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.b{border:none;border-radius:8px;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer}
.bpag{background:#eafaf0;color:#0f8a43}
.card.pag .bpag{background:#0f8a43;color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e4e8eb;padding:10px 14px;display:flex;justify-content:center;box-shadow:0 -2px 8px rgba(0,0,0,.08)}
.avisar{background:#25d366;color:#fff;border:none;border-radius:10px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;width:100%;max-width:652px}
.avisar:disabled{background:#cfd8dc;color:#fff}
</style></head><body>
<div id="app"><div class="sub">Cargando tu lista…</div></div>
<div class="bar"><button id="avisar" class="avisar" disabled>📤 Avisar pagos (0)</button></div>
<script>
(function(){
  var EMPRESA="Innovare";
  var PAGO="💳 Datos para transferencia:\nGrupo Innovare 360\n77.974.821-9\nSantander\nCuenta Corriente\n0-000-372-8025-9\nAdm.grupoinnovare360@gmail.com";
  var app=document.getElementById("app"), btn=document.getElementById("avisar");
  function fail(m){app.innerHTML='<div class="tip">'+m+'</div>';btn.style.display='none';}
  if(typeof LZString==="undefined"){fail("No hay conexión para cargar la página. Revisa tu internet y vuelve a abrir el enlace.");return;}
  var raw=location.hash?location.hash.slice(1):"";
  if(!raw){fail("Este enlace está vacío. Pídele a tu jefe que te reenvíe el enlace completo (a veces WhatsApp lo corta).");return;}
  var data=null;
  try{data=JSON.parse(LZString.decompressFromEncodedURIComponent(raw));}catch(e){data=null;}
  if(!data||!data.c){fail("No pude leer la lista. El enlace puede haber llegado incompleto; pídelo de nuevo.");return;}
  function clp(n){return "$"+Math.round(n||0).toLocaleString("es-CL");}
  var _today=new Date();_today.setHours(0,0,0,0);
  function parseFe(s){if(!s||s==="(falta dato)")return null;var m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);if(!m)return null;return new Date(+m[3],+m[2]-1,+m[1]);}
  function ddOf(fe){var d=parseFe(fe);if(!d)return null;return Math.round((_today-d)/86400000);}
  function buildMsg(nombre,fac){
    var multi=fac.length>1;
    var L=["Hola "+nombre+" 👋","Esperamos que te encuentres muy bien.","Te escribimos de "+EMPRESA+" para compartir el estado actualizado de tu cuenta, donde actualmente registramos "+(multi?"las siguientes facturas pendientes":"la siguiente factura pendiente")+":"];
    var total=0;
    fac.forEach(function(x){
      var dd=ddOf(x.fe);
      var estado="(falta vencimiento)";
      if(dd!=null){estado=dd>0?("*"+dd+" días de vencimiento*"):(dd===0?"*vence hoy*":("*por vencer en "+(-dd)+" días*"));}
      var ref=x.fo?("📄 Factura "+x.fo+" · "+x.fe):(x.fe&&x.fe!=="(falta dato)"?("📄 Vence "+x.fe):"📄 Documento pendiente");
      L.push(ref);L.push("💰 "+clp(x.sa)+" · "+estado);total+=(x.sa||0);
    });
    L.push("━━━━━━━━━━━━━━━━━");L.push("💵 Total adeudado: *"+clp(total)+"*");L.push(PAGO);
    L.push("Agradeceríamos nos pudieras indicar una fecha estimada de pago o enviar el comprobante una vez realizada la transferencia.");
    L.push("Ante cualquier duda o coordinación, estamos atentos para ayudarte.");L.push("¡Muchas gracias por tu preferencia y apoyo! 🙌");L.push("Equipo "+EMPRESA);
    return L.join("\n");
  }
  function fb(t,ok){var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.top="0";ta.style.opacity="0";document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand("copy");ok&&ok();}catch(e){}document.body.removeChild(ta);}

  // enrich clients: total, maxd, msg
  var grand=0;
  data.c.forEach(function(c){
    c.fac=c.fac||[];
    var tot=0,md=null;
    c.fac.forEach(function(x){tot+=(x.sa||0);var dd=ddOf(x.fe);if(dd!=null){md=(md==null)?dd:Math.max(md,dd);}});
    c._tot=tot;c._md=md;c._msg=buildMsg(c.n,c.fac);grand+=tot;
  });

  var KEY="cob_pag_"+(data.v||"x");
  var paid={};try{paid=JSON.parse(localStorage.getItem(KEY)||"{}");}catch(e){}
  function savePaid(){try{localStorage.setItem(KEY,JSON.stringify(paid));}catch(e){}}

  var head='<h1>📋 Cobranza — '+(data.v||"")+'</h1>';
  head+='<div class="sub">'+(data.d||"")+' · '+data.c.length+' clientes · '+clp(grand)+' por cobrar</div>';
  head+='<div class="tip">👉 <b>Toca el nombre</b> del cliente para copiar su mensaje y pegarlo en su chat.<br>💵 Cuando un cliente te mande el comprobante, toca <b>✅ Pagó</b>. Al final, toca <b>📤 Avisar pagos</b> abajo para enviárselos a administración.</div>';
  app.innerHTML=head;

  function updBtn(){var n=data.c.filter(function(c){return paid[c.n];}).length;btn.textContent="📤 Avisar pagos ("+n+")";btn.disabled=n===0;}

  data.c.forEach(function(c){
    var sem=c.s||((c._md!=null&&c._md>=60)?"red":(c._md!=null&&c._md>=1)?"yel":"green");
    var meta=((c._md==null||c._md<0)?"Por vencer":(c._md+" días mora"))+" · "+c.fac.length+" fact.";
    var el=document.createElement("div");
    el.className="card "+sem+(paid[c.n]?" pag":"");
    el.innerHTML='<div class="head"><div><div class="name">'+c.n+' 📋</div><div class="meta">'+meta+'</div><div class="tap">Toca el nombre para copiar</div></div><div class="amount">'+clp(c._tot)+'</div></div><span class="toggle">▸ Ver mensaje</span><div class="msg" style="display:none"></div><div class="acts"><button class="b bpag">'+(paid[c.n]?"✓ Pagado":"✅ Pagó")+'</button></div>';
    el.querySelector(".msg").textContent=c._msg;
    el.querySelector(".toggle").onclick=function(){var m=el.querySelector(".msg");var sh=m.style.display==="none";m.style.display=sh?"block":"none";this.textContent=sh?"▾ Ocultar mensaje":"▸ Ver mensaje";};
    var nm=el.querySelector(".name");
    function flash(){var o=nm.textContent;nm.textContent="✓ Copiado";nm.style.color="#0f8a43";setTimeout(function(){nm.textContent=o;nm.style.color="";},1300);}
    nm.onclick=function(){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(c._msg).then(flash,function(){fb(c._msg,flash);});}else{fb(c._msg,flash);}};
    var pb=el.querySelector(".bpag");
    pb.onclick=function(){if(paid[c.n]){delete paid[c.n];el.classList.remove("pag");pb.textContent="✅ Pagó";}else{paid[c.n]=c._tot||1;el.classList.add("pag");pb.textContent="✓ Pagado";}savePaid();updBtn();};
    app.appendChild(el);
  });
  updBtn();

  btn.onclick=function(){
    var pagados=data.c.filter(function(c){return paid[c.n];});
    if(!pagados.length)return;
    var tot=pagados.reduce(function(s,c){return s+(c._tot||0);},0);
    var L=["✅ *Pagos recibidos — "+(data.v||"")+"*",(data.d||"")+" · "+pagados.length+" clientes · "+clp(tot),""];
    pagados.forEach(function(c){L.push("• "+c.n+" — "+clp(c._tot));});
    L.push("");L.push("(Te reenvío los comprobantes en este chat 📎)");
    var txt=L.join("\n");
    var admin=(data.admin||"").replace(/[^0-9]/g,"");
    if(admin){location.href="https://wa.me/"+admin+"?text="+encodeURIComponent(txt);}
    else{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){alert("Lista de pagos copiada. Pégasela a tu administrador por WhatsApp.");},function(){fb(txt,function(){alert("Lista de pagos copiada.");});});}else{fb(txt,function(){alert("Lista de pagos copiada.");});} }
  };
})();
</script>
</body></html>
